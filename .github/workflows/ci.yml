name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned PowerShell modules
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.22.0 -Force -Scope CurrentUser
          Install-Module -Name Pester -RequiredVersion 5.6.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module -Name Az.Accounts -RequiredVersion 2.19.0 -Force -Scope CurrentUser
          Install-Module -Name Az.Resources -RequiredVersion 6.16.1 -Force -Scope CurrentUser

      - name: PSScriptAnalyzer
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./src -Recurse -Severity Warning,Error
          $results | Format-Table -AutoSize
          if ($results.Count -gt 0) {
            throw "PSScriptAnalyzer reported $($results.Count) issue(s)."
          }

      - name: Pester
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
